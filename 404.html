<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Page introuvable — Budget Orion</title>
<style>
  :root{--g:#21b573;--gd:#128957;--bg:#f8fbf9;--ink:#17251e;--mut:#728077;--line:#e3ece7}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f9fcfa 0,#f4f9f6 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;padding:24px}
  .card{max-width:420px;width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px rgba(25,80,52,.08);padding:28px;text-align:center}
  .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,#39c98a,#20ad6f);display:grid;place-items:center;margin:0 auto 16px;font-size:26px;color:#fff;font-weight:900}
  h1{font-size:19px;margin:0 0 8px}
  p{color:var(--mut);font-size:13px;line-height:1.5;margin:0 0 18px}
  a.btn{display:inline-block;background:linear-gradient(145deg,#11a85c,#078446);color:#fff;text-decoration:none;font-weight:800;padding:12px 20px;border-radius:13px;font-size:13px}
  code{background:#f1f5f2;padding:2px 6px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">B</div>
    <h1>Cette page n’existe plus à cet endroit</h1>
    <p>L’application Budget Orion a déménagé à la racine du dépôt. Les anciennes adresses comme <code>/orion_v2/</code> ou <code>/orion_v21/</code> ne sont plus utilisées.<br><br>Redirection automatique dans quelques secondes…</p>
    <a class="btn" href="/Budget-mensuel-/">Ouvrir Budget Orion</a>
  </div>
</body>
</html>
