<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ORION" />
  <meta name="theme-color" content="#F7F8FA" />
  <title>ORION — Budget</title>
  <style>
/* ═══════════════════════════════════════════════════════════════════════
   ORION v21 — app.css — thème clair premium (Finary / Revolut / Apple Wallet)
   Palette validée : vert #16C47F · fond #F7F8FA · texte bleu nuit #0D1321
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --green:#16C47F; --green-d:#0FA968; --green-l:#EBF8F0;
  --navy:#0D1321; --ink:#0D1321; --mut:#687280; --dim:#9AA3AF;
  --blue-l:#E6F0FF; --orange:#FFB020; --orange-l:#FFF6E6;
  --red:#FF4D4F; --red-l:#FFECEC;
  --bg:#F7F8FA; --card:#FFFFFF; --line:#EDF0F4; --gray-l:#F1F5F9;
  --shadow:0 6px 22px rgba(13,19,33,.06); --shadow-sm:0 3px 12px rgba(13,19,33,.05);
  --shadow-green:0 14px 30px rgba(22,196,127,.28);
  --r:20px; --r-sm:15px; --r-xs:12px;
  --nav-h:64px; --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);overflow-x:hidden;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:15px}
button{border:0;background:none;cursor:pointer}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:var(--r-xs);outline:none;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
::-webkit-scrollbar{display:none}
h1,h2,h3{letter-spacing:-.4px}

.app-shell{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

.topbar{position:sticky;top:0;z-index:20;background:rgba(247,248,250,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 11px;
  display:flex;align-items:center;justify-content:space-between}
.brand-row{display:flex;align-items:center;gap:9px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--green),var(--green-d));
  display:flex;align-items:center;justify-content:center;color:#fff}
.brand-mark svg{width:17px;height:17px;fill:#fff}
.brand{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
.subtitle{font-size:12px;color:var(--mut);margin-top:1px}
.ghost-btn{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--navy);box-shadow:var(--shadow-sm)}
.ghost-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.pages{flex:1;position:relative}
.page{display:none;flex-direction:column;gap:13px;padding:16px 14px calc(var(--nav-h) + var(--safe) + 24px)}
.page.active{display:flex}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.page-h{margin:2px 2px 0}
.page-h h1{font-size:26px;font-weight:800;color:var(--navy)}
.page-h p{font-size:13px;color:var(--mut);margin-top:2px}
.greet h1{font-size:24px;font-weight:800;color:var(--navy)}
.greet p{font-size:13px;color:var(--mut);margin-top:3px;text-transform:capitalize}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:16px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-head h2{font-size:14px;font-weight:800;color:var(--navy)}
.link{font-size:13px;font-weight:700;color:var(--green)}
.empty{color:var(--mut);font-size:13.5px;padding:8px 2px;text-align:center}

.orion-note{display:flex;align-items:center;gap:12px;background:var(--green-l);border:1px solid #D7F0E4;
  border-radius:var(--r);padding:13px 15px}
.orion-note .bot{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid #D7F0E4;
  display:flex;align-items:center;justify-content:center;color:var(--green);flex-shrink:0}
.orion-note .bot svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.orion-note b{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--green-d)}
.orion-note p{font-size:13px;color:var(--navy);margin-top:2px;line-height:1.4}

.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:20px;color:#fff;
  background:radial-gradient(circle at 90% -10%,rgba(255,255,255,.18),transparent 45%),
             linear-gradient(150deg,#1ED28A,#16C47F 55%,#0FA968);box-shadow:var(--shadow-green)}
.hero .eyebrow{color:rgba(255,255,255,.82)}
.hero-amount{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:4px 0 6px}
.hero.masked .hero-amount{filter:blur(9px)}
.hero-delta{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:#EAFFF6}
.hero-delta svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spark{margin:12px 0 2px}
.spark svg{width:100%;height:56px;display:block}
.hero-fore{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:var(--r-xs);padding:10px 13px}
.hero-fore span{font-size:12px;color:rgba(255,255,255,.9)}
.hero-fore b{font-size:15px;font-weight:800}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 9px;box-shadow:var(--shadow-sm);min-width:0}
.kpi .ico{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.kpi .ico svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kpi.green .ico{background:var(--green-l);color:var(--green-d)}
.kpi.red .ico{background:var(--red-l);color:var(--red)}
.kpi.blue .ico{background:var(--blue-l);color:#2563EB}
.kpi.orange .ico{background:var(--orange-l);color:#C77700}
.kpi h3{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi strong{display:block;font-size:15px;font-weight:800;color:var(--navy);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.kpi p{font-size:10.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.usage-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.usage-top b{font-size:14px;font-weight:800;color:var(--navy)}
.usage-top span{font-size:13px;font-weight:800}
.track{height:9px;background:var(--gray-l);border-radius:999px;overflow:hidden}
.track > span{display:block;height:100%;border-radius:999px;background:var(--green)}

.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .check{width:32px;height:32px;border-radius:10px;background:var(--gray-l);color:var(--dim);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .check svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.row.done .check{background:var(--green-l);color:var(--green)}
.row-main{flex:1;min-width:0}
.row-title{font-size:14px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font-size:12px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amount{font-size:14.5px;font-weight:800;flex-shrink:0;white-space:nowrap;letter-spacing:-.3px}
.amount.pos{color:var(--green-d)} .amount.neg{color:var(--navy)}

.goal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.goal-mini{background:var(--gray-l);border-radius:var(--r-sm);padding:13px 8px;text-align:center;min-width:0}
.goal-mini .emoji{font-size:22px}
.goal-mini b{display:block;font-size:12px;font-weight:800;color:var(--navy);margin:6px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{width:52px;height:52px;margin:0 auto}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring .bg{stroke:#E2E8F0}
.ring .fg{stroke:var(--green);stroke-linecap:round}
.ring-label{font-size:12px;font-weight:800;fill:var(--navy);transform:rotate(90deg);transform-origin:center}
.goal-mini small{display:block;font-size:10.5px;color:var(--mut);margin-top:7px}

.insight{display:flex;gap:12px;align-items:flex-start}
.insight .ic{width:34px;height:34px;border-radius:10px;background:var(--green-l);color:var(--green-d);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.insight .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.insight b{font-size:13.5px;font-weight:800;color:var(--navy)}
.insight p{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.45}

.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.list-head h2{font-size:15px;font-weight:800;color:var(--navy)}
.icon-btn{width:34px;height:34px;border-radius:11px;background:var(--green);color:#fff;font-size:20px;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(22,196,127,.3)}
.filters{display:flex;gap:9px;margin-bottom:12px}
.search{flex:1;min-width:0;padding:10px 13px;font-size:14px;background:var(--gray-l);border-color:transparent}
.month-select{padding:10px 11px;font-size:13px;font-weight:700;background:var(--gray-l);border-color:transparent;max-width:44%}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tab{padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--mut);background:var(--gray-l)}
.tab.active{background:var(--green);color:#fff}
.tx-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tx-row:first-of-type{border-top:0}
.tx-icon{width:38px;height:38px;border-radius:11px;background:var(--gray-l);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--mut)}
.tx-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tx-icon.inc{background:var(--green-l);color:var(--green-d)}
.tx-info{flex:1;min-width:0}
.tx-info b{font-size:14px;font-weight:700;color:var(--navy);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-info p{font-size:12px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.donut-wrap{display:flex;gap:16px;align-items:center}
.donut{width:120px;height:120px;flex-shrink:0}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.leg-item{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.leg-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.leg-name{flex:1;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-pct{font-weight:800;color:var(--navy)}
.leg-val{color:var(--mut);font-size:11.5px;width:58px;text-align:right;flex-shrink:0}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px}
.bar-row > span:first-child{width:78px;flex-shrink:0;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-bg{flex:1;height:8px;background:var(--gray-l);border-radius:999px;overflow:hidden;min-width:0}
.bar-bg > span{display:block;height:100%;border-radius:999px;background:var(--green)}
.bar-row b{font-size:12.5px;font-weight:800;color:var(--navy);width:66px;text-align:right;flex-shrink:0}
.big-post{display:flex;align-items:center;gap:12px}
.big-post .ic{width:40px;height:40px;border-radius:12px;background:var(--green-l);color:var(--green-d);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.big-post .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big-post .mid{flex:1;min-width:0}
.big-post b{font-size:15px;font-weight:800;color:var(--navy)}
.big-post p{font-size:12px;color:var(--mut)}
.big-post strong{font-size:15px;font-weight:800;color:var(--navy);flex-shrink:0}

.goal-card{display:flex;align-items:center;gap:14px}
.goal-card .big-emoji{width:46px;height:46px;border-radius:14px;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.goal-card .middle{flex:1;min-width:0}
.goal-card h3{font-size:15px;font-weight:800;color:var(--navy)}
.goal-card p{font-size:12.5px;color:var(--mut);margin:2px 0 8px}
.goal-card .pct{font-size:17px;font-weight:800;color:var(--green);flex-shrink:0}
.progress{height:9px;background:var(--gray-l);border-radius:999px;overflow:hidden}
.progress > span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),#38E0A0)}
.goal-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:6px}

.settings-area textarea{width:100%;height:150px;padding:12px;font-size:12px;font-family:ui-monospace,Menlo,monospace;resize:none}
.set-row{display:flex;gap:10px;margin-top:12px}
.set-row .btn{flex:1}
.danger-zone{border-color:#FADADA}

.btn,.primary,.secondary,.danger{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 16px;border-radius:14px;font-weight:800;font-size:14.5px;width:100%}
.primary{background:var(--green);color:#fff;box-shadow:0 8px 20px rgba(22,196,127,.26)}
.secondary{background:var(--gray-l);color:var(--navy)}
.danger{background:var(--red-l);color:var(--red)}
.primary:active,.secondary:active,.danger:active{transform:scale(.98)}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:480px;margin:0 auto;
  height:calc(var(--nav-h) + var(--safe));padding-bottom:var(--safe);
  background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr)}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:10px;font-weight:700}
.bottom-nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav button.active{color:var(--green)}

.fab{position:fixed;bottom:calc(var(--nav-h) + var(--safe) + 16px);right:16px;z-index:35;
  width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;font-size:28px;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px rgba(22,196,127,.4)}
@media (min-width:480px){ .fab{right:calc(50% - 240px + 16px)} }
.fab:active{transform:scale(.94)}

.sheet-backdrop{position:fixed;inset:0;z-index:40;background:rgba(13,19,33,.38);opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:480px;margin:0 auto;background:#fff;
  border-radius:24px 24px 0 0;padding:14px 18px calc(20px + var(--safe));transform:translateY(100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);max-height:92vh;overflow:auto}
.sheet.open{transform:translateY(0)}
.handle{width:38px;height:4px;border-radius:3px;background:#E2E8F0;margin:0 auto 14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h2{font-size:19px;font-weight:800;color:var(--navy)}
.close-x{width:32px;height:32px;border-radius:10px;background:var(--gray-l);color:var(--mut);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.sheet label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--dim);margin-bottom:12px}
.sheet label input,.sheet label select{display:block;width:100%;margin-top:7px;padding:12px 13px;font-size:15px;color:var(--navy);text-transform:none;letter-spacing:normal}
.sheet .checkline{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:normal;font-size:14px;font-weight:600;color:var(--navy)}
.sheet .checkline input{width:20px;height:20px;margin:0;flex-shrink:0}
.segmented{display:flex;gap:6px;background:var(--gray-l);border-radius:12px;padding:4px;margin-bottom:14px}
.segmented button{flex:1;padding:9px;border-radius:9px;font-size:13.5px;font-weight:800;color:var(--mut)}
.segmented button.active{background:#fff;color:var(--navy);box-shadow:var(--shadow-sm)}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions button{flex:1}

@media (max-width:360px){ .kpi strong{font-size:13px} .hero-amount{font-size:30px} }

</style>
  <style>
/* ═══════════════════════════════════════════════════════════════════════
   ORION V2.2 — app-v22.css — styles ADDITIFS des modules (hub « Plus »).
   Réutilise les tokens de app.css (--green, --card, --line…). Ne modifie rien.
   ═══════════════════════════════════════════════════════════════════════ */

/* En-tête de module avec retour */
.v22-head{display:flex;align-items:center;gap:10px;margin:2px 2px 4px}
.v22-back{width:34px;height:34px;border-radius:11px;background:#fff;border:1px solid var(--line);
  color:var(--navy);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.v22-head h1{font-size:24px;font-weight:800;color:var(--navy)}

/* Grille du hub */
.v22-hub{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.v22-tile{display:flex;flex-direction:column;align-items:flex-start;gap:9px;text-align:left;padding:16px}
.v22-tile-ic{width:40px;height:40px;border-radius:12px;background:var(--green-l);color:var(--green-d);
  display:flex;align-items:center;justify-content:center}
.v22-tile-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.v22-tile b{font-size:14.5px;font-weight:800;color:var(--navy)}
.v22-tile small{font-size:12px;color:var(--mut);line-height:1.35}

/* Blocs internes de module (réutilisent .card) */
.v22-h2{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:8px}
.v22-sub{font-size:12.5px;color:var(--mut);line-height:1.45;margin-bottom:12px}
.v22-textarea{width:100%;height:150px;padding:12px;font-size:12px;font-family:ui-monospace,Menlo,monospace;
  border:1px solid var(--line);border-radius:12px;resize:none;color:var(--navy);background:#fff}
.v22-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.v22-actions .btn,.v22-actions .primary,.v22-actions .secondary{flex:1;min-width:120px;width:auto}

/* Lignes d'historique (réutilise .set-group) */
.v22-bk{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line-soft,#F1F3F6);width:100%;text-align:left}
.v22-bk:first-child{border-top:0}
.v22-bk .bk-ic{width:32px;height:32px;border-radius:9px;background:var(--gray-l);color:var(--mut);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v22-bk .bk-ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.v22-bk .bk-main{flex:1;min-width:0}

  <script>
(function(){
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   ORION v21 — app.js
   Moteur compatible (lit bgt4 / budgetV3 / budgetV2, écrit bgt4) + UI premium.
   Aucune dépendance. Objectifs : montant courant propre à chaque objectif.
   ═══════════════════════════════════════════════════════════════════════ */
const ML=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const JOURS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const cats={logement:'Logement',transport:'Transport',alimentation:'Alimentation',abonnements:'Abonnements',enfants:'Enfants',credits:'Crédits',assurances:'Assurances',loisirs:'Loisirs',sante:'Santé',autres:'Autres'};

/* ── Icônes SVG (pas d'emoji hors objectifs) ─────────────────────────── */
const PATHS={
  home:'<path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/>',
  car:'<path d="M5 16 6.2 9.5A2 2 0 0 1 8.2 8h7.6a2 2 0 0 1 2 1.5L19 16"/><path d="M4 16h16v3H5a1 1 0 0 1-1-1z"/><circle cx="7.5" cy="18.5" r="1.2"/><circle cx="16.5" cy="18.5" r="1.2"/>',
  cart:'<circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/><path d="M3 4h2l2.2 11h10l1.8-8H6.2"/>',
  phone:'<rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/>',
  heart:'<path d="M12 20s-6.5-4.2-6.5-9A3.3 3.3 0 0 1 12 7.6 3.3 3.3 0 0 1 18.5 11c0 4.8-6.5 9-6.5 9z"/>',
  card:'<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10h18"/>',
  shield:'<path d="M12 3l7 3v6c0 4.8-7 9-7 9s-7-4.2-7-9V6z"/>',
  star:'<path d="M12 4l2.3 4.7 5.2.8-3.8 3.6.9 5.2L12 16.7 7.4 18.3l.9-5.2L4.5 9.5l5.2-.8z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  dot:'<circle cx="12" cy="12" r="7"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  down:'<path d="M12 5v14M5 12l7 7 7-7"/>',
  wallet:'<path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5.5A2.5 2.5 0 0 1 3 16.5z"/><path d="M16 12.5h2.5"/>',
  alert:'<path d="M12 4l9 15.5H3z"/><path d="M12 10v4M12 17h.01"/>',
  check:'<path d="M5 12l4.5 4.5L19 7"/>',
  chart:'<path d="M4 20h16"/><path d="M7 20v-6M12 20V9M17 20v-10"/>',
  spark:'<path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  robot:'<rect x="5" y="8" width="14" height="10" rx="3.2"/><circle cx="9.6" cy="13" r="1"/><circle cx="14.4" cy="13" r="1"/><path d="M12 5v3M9.5 18v2M14.5 18v2"/>'
};
function icon(n){return '<svg viewBox="0 0 24 24">'+(PATHS[n]||PATHS.dot)+'</svg>';}
const CAT_ICON={logement:'home',transport:'car',alimentation:'cart',abonnements:'phone',enfants:'heart',credits:'card',assurances:'shield',loisirs:'star',sante:'plus',autres:'dot'};

const defaultGoals=[
  {id:'maison',n:'Maison',e:'🏡',target:80000,current:0},
  {id:'urgence',n:"Fonds d'urgence",e:'🛡️',target:10000,current:0},
  {id:'voyage',n:'Voyage',e:'✈️',target:3000,current:0}
];
const GOAL_EMOJIS=['🏡','✈️','🚗','🛡️','💍','🎓','🏖️','💻','📈','🎯'];

let year=new Date().getFullYear();
let month=new Date().getMonth();
let currentPage='dashboard';
let filter='all';
let sortMode='order';
let app=load();
let goals=loadGoals();

/* ── Utils ───────────────────────────────────────────────────────────── */
function $(id){return document.getElementById(id);}
function num(v){v=parseFloat(v);return isFinite(v)?v:0;}
function eur(v){v=num(v);return (v<0?'-':'')+Math.abs(v).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function short(v){v=num(v);return Math.abs(v)>=1000?(v<0?'-':'')+(Math.abs(v)/1000).toLocaleString('fr-FR',{maximumFractionDigits:1})+'k €':eur(v);}
function p2(n){return String(n).padStart(2,'0');}
function today(){let d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function dateFR(s){if(!s)return 'Sans date';let p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]:'Sans date';}
/* Urgence des échéances : couleur + libellé calculés à partir de la date réelle du jour */
function daysLeft(s){if(!s)return null;let p=String(s).split('-');if(p.length!==3)return null;let d=new Date(+p[0],+p[1]-1,+p[2]);d.setHours(0,0,0,0);let t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000);}
function dueInfo(r){
  if(r.paid)return{paid:true,color:'ok',label:r.paidDate?('Payé '+dateFR(r.paidDate)):'Payé',rank:9e9};
  let dl=daysLeft(r.dueDate);
  if(dl==null)return{color:'gray',label:'Sans date',days:null,rank:8e8};
  let color=dl<=2?'red':dl<=5?'orange':dl<=10?'yellow':'green'; // rouge = retard/aujourd'hui/1-2j
  let label=dl<0?('En retard de '+Math.abs(dl)+' jour'+(Math.abs(dl)>1?'s':'')):dl===0?'Aujourd’hui':dl===1?'Demain':('Dans '+dl+' jours');
  return{color:color,label:label,days:dl,rank:dl};
}
function dueDot(info){return '<span class="due-dot due-'+info.color+'" aria-hidden="true"></span>';}
function dueLegend(){return '<div class="due-legend"><span><span class="due-dot due-red"></span>Urgent</span><span><span class="due-dot due-orange"></span>Très proche</span><span><span class="due-dot due-yellow"></span>Prochainement</span><span><span class="due-dot due-green"></span>Plus tard</span><span><span class="due-dot due-gray"></span>Sans date</span></div>';}
function rowRank(o){return o.type==='expense'?dueInfo(o.r).rank:((o.r.paid||isAutoIncome(o.r))?9e9:8e8);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

/* ── Modèle de données (compatible bgt4 / budgetV3 / budgetV2) ───────── */
function mkRow(n,a,d,c){return{name:n||'',amount:num(a),paid:false,dueDate:d||'',paidDate:'',cat:c||'autres'};}
function isAutoIncome(r){return !!(r&&r.auto)||/salaire|paie|pay/i.test((r&&r.name)||'');}
function guessCat(n){n=(n||'').toLowerCase();if(/loyer|pret|prêt|logement|electricit|électricit|gaz|eau|immo|lit/.test(n))return'logement';if(/voiture|essence|autoroute|vinci|parking|transport/.test(n))return'transport';if(/supermarch|course|aliment|restaurant|carrefour/.test(n))return'alimentation';if(/mobile|internet|freebox|netflix|spotify|apple|abonnement/.test(n))return'abonnements';if(/cantine|ecole|école|creche|crèche|enfant/.test(n))return'enfants';if(/credit|crédit|cetelem|natixis|cofidis|klarna/.test(n))return'credits';if(/assurance|mutuelle/.test(n))return'assurances';if(/loisir|vacance|cinema|cinéma|sport/.test(n))return'loisirs';if(/pharma|medecin|médecin|sante|santé/.test(n))return'sante';return'autres';}
function defIncome(){let sal=mkRow('Salaire',0,'','autres');sal.auto=true;sal.paid=true;let sup=mkRow('Revenus supplémentaires',0,'','autres');sup.auto=false;return[sal,sup];}
function defExpenses(){return[mkRow('Logement',0,'','logement'),mkRow('Supermarché',0,'','alimentation'),mkRow('Assurance voiture',0,'','assurances'),mkRow('Essence',0,'','transport'),mkRow('Free mobile',0,'','abonnements')];}
function defMonth(){return{income:defIncome(),expenses:defExpenses(),savings:{amount:0,paid:false,date:''}};}
function fix(r){r.name=r.name||'';r.amount=num(r.amount);r.paid=!!r.paid;r.dueDate=r.dueDate||'';r.paidDate=r.paidDate||'';r.cat=r.cat||guessCat(r.name);if(isAutoIncome(r)){r.auto=true;r.paid=true;}}
function migrateMonth(mo,pk){
  let inc=(Array.isArray(mo.income)?mo.income:defIncome()).map(r=>{let c=Object.assign({},r);fix(c);return c;});
  let exp=(Array.isArray(mo.expenses)?mo.expenses:[]).map(e=>{let c=Object.assign({},e);fix(c);if(c.life==null)c.life=0;if(!c.createdPeriod)c.createdPeriod=pk;return c;});
  let sav=mo.savings||{};
  return {income:inc,expenses:exp,savings:{amount:num(sav.amount),paid:!!sav.paid,date:sav.date||''}};
}
/* Un mois est "vide" (squelette hérité) si aucun montant > 0 et aucune dépense payée.
   On ignore le "payé" du revenu auto (salaire) qui vaut 0 dans le squelette. */
function isEmptyMonth(mo){
  if(!mo)return true;
  let inc=(mo.income||[]).some(o=>num(o.amount)>0);
  let exp=(mo.expenses||[]).some(o=>num(o.amount)>0||o.paid);
  let sav=mo.savings&&num(mo.savings.amount)>0;
  return !inc&&!exp&&!sav;
}
/* Amorce des modèles récurrents depuis un mois réel, sur un objet donné. */
function seedTemplatesInto(store,key){
  let mo=store.monthlyData&&store.monthlyData[key]; if(!mo)return 0;
  store.recurringTemplates=store.recurringTemplates||[];
  let seen={},n=0;
  function add(kind,r){
    let sig=kind+'|'+(r.name||'').toLowerCase()+'|'+num(r.amount)+'|'+(r.cat||'');
    if(seen[sig])return seen[sig];
    let day=r.dueDate?(Number(String(r.dueDate).split('-')[2])||1):1;
    let life=num(r.life)||0;
    let t={id:newId('tpl'),kind:kind,name:r.name,amount:num(r.amount),cat:r.cat||'autres',freq:'monthly',interval:1,installments:(kind==='expense'&&life>0)?life:0,startDate:(r.createdPeriod||key)+'-'+p2(day),endDate:'',dueDay:day,auto:!!r.auto,seeded:true};
    store.recurringTemplates.push(t);seen[sig]=t;n++;return t;
  }
  (mo.income||[]).forEach(r=>{let t=add('income',r);r.templateId=t.id;});
  (mo.expenses||[]).forEach(r=>{let t=add('expense',r);r.templateId=t.id;});
  return n;
}
function latestRealKey(d){
  let ks=Object.keys(d.monthlyData||{}).filter(k=>!isEmptyMonth(d.monthlyData[k])).sort();
  return ks.length?ks[ks.length-1]:null;
}
function normalize(d){
  if(!d)d={};
  /* Migration douce vers la structure annuelle (schéma 2).
     L'ancienne clé "months" est CONSERVÉE telle quelle (revert possible, zéro perte). */
  if(!d.years){
    let y0=Number.isInteger(d.currentYear)?d.currentYear:new Date().getFullYear();
    d.years={}; d.years[y0]={months:{}};
    if(d.months){ for(let i=0;i<12;i++){ let mo=d.months[i]||d.months[String(i)]; if(mo) d.years[y0].months[i]=migrateMonth(mo,pkey(y0,i)); } }
    d.currentYear=y0;
    if(!Number.isInteger(d.currentMonth))d.currentMonth=new Date().getMonth();
    d.schema=2; d._migrated=true;
  }
  /* Champs par défaut sur toutes les périodes existantes (idempotent) */
  Object.keys(d.years).forEach(yk=>{
    let Y=d.years[yk]; Y.months=Y.months||{};
    Object.keys(Y.months).forEach(mk=>{
      let mo=Y.months[mk];
      mo.income=Array.isArray(mo.income)?mo.income:defIncome();
      mo.expenses=Array.isArray(mo.expenses)?mo.expenses:[];
      mo.savings=mo.savings||{amount:0,paid:false,date:''};
      mo.income.forEach(fix);
      mo.expenses.forEach(e=>{fix(e);if(e.life==null)e.life=0;if(!e.createdPeriod)e.createdPeriod=yk+'-'+p2(Number(mk)+1);});
      mo.savings.amount=num(mo.savings.amount);mo.savings.paid=!!mo.savings.paid;mo.savings.date=mo.savings.date||'';
    });
  });
  if(!d.savings)d.savings={balance:0,target:50000,monthlyTarget:1000,history:{}};
  if(!d.savings.history)d.savings.history={};
  /* ── Schéma 3 : monthlyData (clés "YYYY-MM") + recurringTemplates ─────
     Historique réel par mois (jamais écrasé) + moteur de récurrence.
     Construit depuis "years" (schéma 2). years/months restent conservés. */
  if(!Array.isArray(d.recurringTemplates))d.recurringTemplates=[];
  if(!d.monthlyData){
    d.monthlyData={};
    Object.keys(d.years||{}).forEach(yk=>{let Y=d.years[yk];Object.keys(Y.months||{}).forEach(mk=>{
      let key=yk+'-'+p2(Number(mk)+1);
      d.monthlyData[key]=JSON.parse(JSON.stringify(Y.months[mk]));
    });});
    d._migrated=true; d._needBackup=true;
  }
  Object.keys(d.monthlyData).forEach(key=>{
    let mo=d.monthlyData[key];
    mo.income=Array.isArray(mo.income)?mo.income:[];
    mo.expenses=Array.isArray(mo.expenses)?mo.expenses:[];
    mo.savings=mo.savings||{amount:0,paid:false,date:''};
    mo.meta=mo.meta||{note:''};
    mo.income.forEach(fix);
    mo.expenses.forEach(e=>{fix(e);if(e.life==null)e.life=0;});
    mo.savings.amount=num(mo.savings.amount);mo.savings.paid=!!mo.savings.paid;mo.savings.date=mo.savings.date||'';
  });
  /* Réparation (v3b) : neutralise les anciens "mois squelette vides" (tout à 0, rien payé)
     hérités de l'ancienne app, pour qu'ils soient RÉGÉNÉRÉS depuis les modèles récurrents.
     Reconstruit les modèles depuis le dernier vrai mois s'ils sont absents/vides. Non destructif. */
  if(!d._repairedEmptyV3){
    let real=latestRealKey(d);
    let tplEmpty=!Array.isArray(d.recurringTemplates)||d.recurringTemplates.length===0||d.recurringTemplates.every(t=>num(t.amount)===0);
    if(real && tplEmpty){ d.recurringTemplates=[]; seedTemplatesInto(d,real); }
    Object.keys(d.monthlyData).forEach(k=>{ if(isEmptyMonth(d.monthlyData[k])) delete d.monthlyData[k]; });
    d._repairedEmptyV3=true; d._migrated=true;
  }
  d.schema=3;
  year=Number.isInteger(d.currentYear)?d.currentYear:new Date().getFullYear();
  month=Number.isInteger(d.currentMonth)?d.currentMonth:new Date().getMonth();
  return d;
}

/* ── Calculs (recalcul instantané) ───────────────────────────────────── */
/* ── Périodes (mois + année) & report automatique ─────────────────────── */
function pkey(y,mo){return y+'-'+p2(mo+1);}                       // "2026-08"
function curKey(){return pkey(year,month);}
function monthsBetween(a,b){let pa=String(a).split('-'),pb=String(b).split('-');return (Number(pb[0])-Number(pa[0]))*12+(Number(pb[1])-Number(pa[1]));}
function yData(y){app.years=app.years||{};if(!app.years[y])app.years[y]={months:{}};if(!app.years[y].months)app.years[y].months={};return app.years[y];}
/* readPeriod : voir version basée sur monthlyData plus bas */
function shiftDue(due,toKey){if(!due)return '';let p=String(due).split('-');if(p.length!==3)return '';let tp=String(toKey).split('-'),y=Number(tp[0]),mo=Number(tp[1]),last=new Date(y,mo,0).getDate();return y+'-'+p2(mo)+'-'+p2(Math.min(Number(p[2]),last));}
function expActive(e,toKey){let life=num(e.life)||0;if(life<=0)return true;let created=e.createdPeriod||toKey;let el=monthsBetween(created,toKey);return el>=0&&el<=life-1;}
function cloneExpTo(e,toKey){return {name:e.name,amount:num(e.amount),cat:e.cat||'autres',paid:false,paidDate:'',dueDate:shiftDue(e.dueDate,toKey),createdPeriod:e.createdPeriod||toKey,life:num(e.life)||0};}
function cloneIncTo(r){return {name:r.name,amount:num(r.amount),cat:r.cat||'autres',paid:false,paidDate:'',dueDate:'',auto:!!r.auto};}
function carryForward(src,toKey){
  return { income:(src.income||[]).map(cloneIncTo),
           expenses:(src.expenses||[]).filter(e=>expActive(e,toKey)).map(e=>cloneExpTo(e,toKey)),
           savings:{amount:0,paid:false,date:''} };
}
function findPrior(y,mo){let yy=y,mm=mo;for(let n=0;n<48;n++){mm--;if(mm<0){mm=11;yy--;}let Y=app.years&&app.years[yy];if(Y&&Y.months[mm])return {y:yy,mo:mm,obj:Y.months[mm]};}return null;}
function ensurePeriodLegacy(y,mo){ // ancienne logique de report (conservée, non utilisée)
  let Y=yData(y);
  if(Y.months[mo])return Y.months[mo];
  let prior=findPrior(y,mo);
  Y.months[mo]= prior ? carryForward(prior.obj,pkey(y,mo)) : defMonth();
  Y.months[mo].expenses.forEach(e=>{if(e.createdPeriod==null)e.createdPeriod=pkey(y,mo);if(e.life==null)e.life=0;});
  return Y.months[mo];
}
function ensurePeriod(y,mo){ return ensureKey(pkey(y,mo)); }
function readPeriod(y,mo){ return readKey(pkey(y,mo)); }

/* ── Récurrence (schéma 3) ───────────────────────────────────────────── */
function newId(p){return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function findTpl(id){return (app.recurringTemplates||[]).find(t=>t.id===id)||null;}
function lastDay(key){return new Date(Number(key.slice(0,4)),Number(key.slice(5,7)),0).getDate();}
function tplOccurrence(t,key){ // index d'occurrence du modèle pour le mois "YYYY-MM", ou null
  let startKey=String(t.startDate||'').slice(0,7); if(!startKey||key<startKey)return null;
  if(t.endDate){let endKey=String(t.endDate).slice(0,7);if(key>endKey)return null;}
  let el=monthsBetween(startKey,key); if(el<0)return null;
  let occ;
  if(t.freq==='once'){ if(el!==0)return null; occ=0; }
  else if(t.freq==='everyN'){ let iv=Math.max(1,num(t.interval)||1); if(el%iv!==0)return null; occ=el/iv; }
  else { occ=el; }
  let inst=num(t.installments)||0; if(inst>0&&occ>=inst)return null; // échéancier terminé
  return occ;
}
function opFromTpl(t,key){
  let day=Math.min(Math.max(1,num(t.dueDay)||1),lastDay(key));
  return {name:t.name,amount:num(t.amount),cat:t.cat||'autres',paid:false,paidDate:'',
          dueDate:t.kind==='income'?'':key+'-'+p2(day),auto:t.kind==='income'&&!!t.auto,
          templateId:t.id,recurring:true,life:0,createdPeriod:key};
}
function generateFromTemplates(key){
  let inc=[],exp=[];
  (app.recurringTemplates||[]).forEach(t=>{ if(tplOccurrence(t,key)!=null){ let o=opFromTpl(t,key); (t.kind==='income'?inc:exp).push(o); } });
  return {income:inc,expenses:exp,savings:{amount:0,paid:false,date:''},meta:{generated:true,note:''}};
}
function readKey(key){ return (app.monthlyData&&app.monthlyData[key]) || {income:[],expenses:[],savings:{amount:0,paid:false,date:''},_transient:true}; }
function ensureKey(key){
  app.monthlyData=app.monthlyData||{};
  if(app.monthlyData[key])return app.monthlyData[key]; // ne JAMAIS écraser un mois existant
  let base=(app.recurringTemplates&&app.recurringTemplates.length)?generateFromTemplates(key):defMonth();
  if(!base.meta)base.meta={generated:true,note:''};
  app.monthlyData[key]=base; save(); return base;
}
function generateMissing(key){ // bouton de secours : ajoute seulement le manquant, sans doublon
  let mo=ensureKey(key),added=0;
  (app.recurringTemplates||[]).forEach(t=>{
    if(tplOccurrence(t,key)==null)return;
    let list=t.kind==='income'?mo.income:mo.expenses;
    let exists=list.some(o=>o.templateId===t.id||(o.name||'').toLowerCase()===(t.name||'').toLowerCase());
    if(!exists){ list.push(opFromTpl(t,key)); added++; }
  });
  if(added)save();
  return added;
}
function seedTemplatesFromMonth(key){ return seedTemplatesInto(app,key); }
/* ── Bascule vers le mois suivant ────────────────────────────────────────
   Copie les opérations RÉCURRENTES actives du mois courant vers le mois
   suivant (gère déc→jan), sans doublon, statut remis à "Prévu". Les
   opérations ponctuelles (sans modèle) ou terminées (échéancier fini /
   hors période) ne sont pas copiées. N'écrase jamais l'existant. */
function nextKeyOf(y,mo){ let m2=mo+1,y2=y; if(m2>11){m2=0;y2++;} return {y:y2,mo:m2,key:pkey(y2,m2)}; }
function rollToNextMonth(){
  let cur=m();
  let nx=nextKeyOf(year,month);
  app.monthlyData=app.monthlyData||{};
  let created=!app.monthlyData[nx.key];
  let target=app.monthlyData[nx.key]||{income:[],expenses:[],savings:{amount:0,paid:false,date:''},meta:{note:''}};
  app.monthlyData[nx.key]=target;
  let added=0;
  function copyList(src,dst,kind){
    (src||[]).forEach(op=>{
      if(!op.templateId)return;                              // ponctuelle : ignorée
      let tpl=findTpl(op.templateId);
      if(tpl && tplOccurrence(tpl,nx.key)==null)return;      // terminée / hors période : ignorée
      if(dst.some(o=>o.templateId===op.templateId||(o.name||'').toLowerCase()===(op.name||'').toLowerCase()))return; // pas de doublon
      let day=op.dueDate?(Number(String(op.dueDate).split('-')[2])||1):(tpl?tpl.dueDay:1);
      dst.push({name:op.name,amount:num(op.amount),cat:op.cat||'autres',paid:false,paidDate:'',
        dueDate:kind==='income'?'':nx.key+'-'+p2(Math.min(Math.max(1,day),lastDay(nx.key))),
        auto:kind==='income'?!!op.auto:false,templateId:op.templateId,recurring:true,createdPeriod:op.createdPeriod||curKey()});
      added++;
    });
  }
  copyList(cur.income,target.income,'income');
  copyList(cur.expenses,target.expenses,'expense');
  if(created&&added===0){ delete app.monthlyData[nx.key]; } // ne pas laisser un mois vide
  else save();
  return {added:added,key:nx.key,y:nx.y,mo:nx.mo};
}

/* ── Calculs (recalcul instantané) ───────────────────────────────────── */
function m(){return ensureKey(curKey());}
function totalsObj(mi){
  let tin=0,tex=0,pin=0,pex=0;
  mi.income.forEach(r=>{tin+=num(r.amount);if(r.paid||isAutoIncome(r))pin+=num(r.amount);});
  mi.expenses.forEach(r=>{tex+=num(r.amount);if(r.paid)pex+=num(r.amount);});
  let future=mi.expenses.filter(r=>!r.paid).reduce((s,r)=>s+num(r.amount),0);
  let futureCount=mi.expenses.filter(r=>!r.paid&&num(r.amount)>0).length;
  return {tin,tex,pin,pex,solde:pin-pex,final:pin-tex,future,futureCount,sav:num((mi.savings||{}).amount),pct:tin?Math.round(tex/tin*100):0};
}
function totals(){return totalsObj(m());}
function finalOf(k){return totalsObj(readPeriod(year,k)).final;}
function prevTotals(){let pm=month-1,py=year;if(pm<0){pm=11;py--;}return totalsObj(readPeriod(py,pm));}
function yearFinals(){let a=[];for(let k=0;k<12;k++)a.push(finalOf(k));return a;}
function catTotals(){let out={};m().expenses.forEach(r=>{if(num(r.amount)>0)out[r.cat]=(out[r.cat]||0)+num(r.amount);});return out;}
function upcoming(n){return m().expenses.filter(r=>!r.paid&&num(r.amount)>0).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999')).slice(0,n||5);}
function biggestCat(){let ct=catTotals(),ks=Object.keys(ct).sort((a,b)=>ct[b]-ct[a]);return ks[0]?{key:ks[0],name:cats[ks[0]]||ks[0],val:ct[ks[0]]}:null;}
function dayCurve(){
  let mi=m(),days=new Date(year,month+1,0).getDate();
  let inc=0;mi.income.forEach(r=>{if(r.paid||isAutoIncome(r))inc+=num(r.amount);});
  let byDay=new Array(days).fill(0);
  mi.expenses.forEach(r=>{let d=r.dueDate?Number(String(r.dueDate).split('-')[2]):1;d=Math.max(1,Math.min(days,d||1));byDay[d-1]+=num(r.amount);});
  let bal=inc,out=[inc];for(let i=0;i<days;i++){bal-=byDay[i];out.push(bal);}return out;
}

/* ── SVG helpers ─────────────────────────────────────────────────────── */
function sparkFrom(vals,stroke){
  stroke=stroke||'#16C47F';
  if(!vals||vals.length<2)vals=[0,0];
  let max=Math.max.apply(null,vals),min=Math.min.apply(null,vals),rng=(max-min)||1,W=280,H=60,step=W/(vals.length-1);
  let pts=vals.map((v,i)=>(i*step).toFixed(0)+','+(H-5-(v-min)/rng*(H-12)).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="'+stroke+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function ringSVG(pct){
  let R=22,C=2*Math.PI*R,off=C*(1-Math.min(100,pct)/100);
  return '<div class="ring"><svg viewBox="0 0 52 52"><circle class="bg" cx="26" cy="26" r="'+R+'" fill="none" stroke-width="5"/><circle class="fg" cx="26" cy="26" r="'+R+'" fill="none" stroke-width="5" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/><text class="ring-label" x="26" y="30" text-anchor="middle">'+pct+'%</text></svg></div>';
}
function donutSVG(ct){
  let keys=Object.keys(ct).filter(k=>ct[k]>0).sort((a,b)=>ct[b]-ct[a]);
  let total=keys.reduce((s,k)=>s+ct[k],0);
  if(!total)return '';
  let r=48,cx=60,cy=60,start=-Math.PI/2,paths='';
  keys.forEach(k=>{let ang=ct[k]/total*2*Math.PI,end=start+ang,x1=cx+r*Math.cos(start),y1=cy+r*Math.sin(start),x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end),lg=ang>Math.PI?1:0;paths+='<path d="M'+cx+' '+cy+' L'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+r+' '+r+' 0 '+lg+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z" fill="'+catColor(k)+'"/>';start=end;});
  return '<svg class="donut" viewBox="0 0 120 120">'+paths+'<circle cx="60" cy="60" r="30" fill="#fff"/><text x="60" y="57" text-anchor="middle" font-size="15" font-weight="800" fill="#0D1321">'+short(total)+'</text><text x="60" y="73" text-anchor="middle" font-size="9" fill="#9AA3AF">Total</text></svg>';
}

function txRow(r,type,idx){
  let done=r.paid||isAutoIncome(r);
  let info=type==='expense'?dueInfo(r):null;
  let sub;
  if(type==='income'){ sub='Revenu · '+(done?'reçu':'en attente'); }
  else if(done){ sub=(cats[r.cat]||'Autres')+' · '+(r.paidDate?('payé '+dateFR(r.paidDate)):'payé'); }
  else { sub=(cats[r.cat]||'Autres')+' · '+info.label+(r.dueDate?' · '+dateFR(r.dueDate):''); }
  let dot=(type==='expense'&&!done)?dueDot(info):'';
  return '<div class="tx-row">'
    +'<button class="tx-icon '+(done?'inc':'')+'" data-toggle="'+type+'" data-index="'+idx+'" aria-label="Confirmer">'+(done?icon('check'):icon(type==='income'?'up':(CAT_ICON[r.cat]||'dot')))+'</button>'
    +'<div class="tx-info" data-edit="'+type+'" data-index="'+idx+'"><b>'+dot+esc(r.name)+'</b><p>'+sub+'</p></div>'
    +'<div class="amount '+(type==='income'?'pos':'neg')+'">'+(type==='income'?'+':'-')+eur(r.amount)+'</div></div>';
}
function renderTransactions(){
  let mi=m();
  let rows=[].concat(mi.income.map((r,i)=>({r,type:'income',idx:i})),mi.expenses.map((r,i)=>({r,type:'expense',idx:i})));
  let q=(($('txSearch')&&$('txSearch').value)||'').toLowerCase();
  rows=rows.filter(o=>(filter==='all'||filter===o.type)&&(!q||o.r.name.toLowerCase().includes(q)||(cats[o.r.cat]||'').toLowerCase().includes(q)));
  if(sortMode==='due'){ rows.sort((a,b)=>rowRank(a)-rowRank(b)); }
  $('page-transactions').innerHTML=
    '<section class="card"><div class="list-head"><h2>Transactions</h2><button class="icon-btn" id="addLine" aria-label="Ajouter">+</button></div>'
    +'<div class="filters"><input class="search" id="txSearch" placeholder="Rechercher" value="'+esc(q)+'"></div>'
    +'<div class="period-nav"><button class="pn-arrow" data-period="prev" aria-label="Mois précédent">‹</button>'
      +'<select class="pn-select" id="monthPick" aria-label="Mois">'+ML.map((x,i)=>'<option value="'+i+'"'+(i===month?' selected':'')+'>'+x+'</option>').join('')+'</select>'
      +'<select class="pn-select" id="yearPick" aria-label="Année">'+yearOptions()+'</select>'
      +'<button class="pn-arrow" data-period="next" aria-label="Mois suivant">›</button></div>'
    +'<button class="secondary" id="rollNextBtn" style="width:100%;margin-bottom:12px">Basculer vers le mois suivant</button>'
    +'<div class="tabs"><button class="tab '+(filter==='all'?'active':'')+'" data-filter="all">Tout</button><button class="tab '+(filter==='income'?'active':'')+'" data-filter="income">Revenus</button><button class="tab '+(filter==='expense'?'active':'')+'" data-filter="expense">Dépenses</button><button class="tab sort'+(sortMode==='due'?' active':'')+'" data-sort="toggle">Échéance</button></div>'
    +dueLegend()
    +(rows.length?rows.map(o=>txRow(o.r,o.type,o.idx)).join(''):'<p class="empty">Aucune ligne pour ce filtre.</p>')
    +'</section>';
}

/* ── STATS ───────────────────────────────────────────────────────────── */
function renderStats(){
  let ct=catTotals(),total=Object.values(ct).reduce((s,v)=>s+v,0),t=totals(),prev=prevTotals(),diff=t.tex-prev.tex,big=biggestCat();
  let keys=Object.keys(ct).sort((a,b)=>ct[b]-ct[a]);
  let legend=keys.slice(0,6).map(k=>'<div class="leg-item"><span class="leg-dot" style="background:'+catColor(k)+'"></span><span class="leg-name">'+(cats[k]||k)+'</span><span class="leg-pct">'+Math.round(ct[k]/(total||1)*100)+'%</span><span class="leg-val">'+eur(ct[k])+'</span></div>').join('');
  $('page-stats').innerHTML=
    '<div class="page-h"><h1>Statistiques</h1><p>'+ML[month]+' '+year+'</p></div>'
    +'<section class="card"><div class="section-head"><h2>Dépenses du mois</h2><b style="color:var(--navy)">'+eur(t.tex)+'</b></div><div class="spark">'+sparkFrom(dayCurve(),'#16C47F')+'</div></section>'
    +'<section class="card"><h2 style="font-size:14px;font-weight:800;color:var(--navy);margin-bottom:14px">Répartition des dépenses</h2>'
      +(total?('<div class="donut-wrap">'+donutSVG(ct)+'<div class="legend">'+legend+'</div></div>'):'<p class="empty">Aucune dépense ce mois-ci.</p>')+'</section>'
    +'<section class="card"><h2 style="font-size:14px;font-weight:800;color:var(--navy);margin-bottom:12px">Comparaison mois précédent</h2><div class="insight"><div class="ic">'+icon('chart')+'</div><div><b>'+(diff<=0?'−':'+')+eur(Math.abs(diff))+' de dépenses vs '+ML[(month+11)%12]+'</b><p>Revenus '+eur(t.tin)+' · Dépenses '+eur(t.tex)+' · Reste '+eur(t.final)+'</p></div></div></section>'
    +'<section class="card"><h2 style="font-size:14px;font-weight:800;color:var(--navy);margin-bottom:12px">Plus gros poste</h2>'
      +(big?('<div class="big-post"><div class="ic">'+icon(CAT_ICON[big.key]||'dot')+'</div><div class="mid"><b>'+big.name+'</b><p>'+Math.round(big.val/(total||1)*100)+'% des dépenses</p></div><strong>'+eur(big.val)+'</strong></div>'):'<p class="empty">Aucune dépense.</p>')+'</section>';
}

/* ── OBJECTIFS ───────────────────────────────────────────────────────── */
function goalCard(g,i){
  let pct=g.target>0?Math.min(100,Math.round(g.current/g.target*100)):0;
  return '<section class="card goal-card" data-goaledit="'+i+'"><div class="big-emoji">'+g.e+'</div><div class="middle"><h3>'+esc(g.n)+'</h3><p>'+eur(g.current)+' / '+eur(g.target)+'</p><div class="progress"><span style="width:'+pct+'%"></span></div><div class="goal-foot"><span>Reste '+eur(Math.max(0,g.target-g.current))+'</span><span>'+pct+'%</span></div></div><b class="pct">'+pct+'%</b></section>';
}
function renderGoals(){
  $('page-goals').innerHTML=
    '<section class="card"><div class="list-head"><h2>Objectifs</h2><button class="icon-btn" id="addGoal" aria-label="Ajouter">+</button></div><p class="empty" style="text-align:left;padding:0">Touche un objectif pour modifier son montant.</p></section>'
    +(goals.length?goals.map((g,i)=>goalCard(g,i)).join(''):'<section class="card"><p class="empty">Aucun objectif. Ajoute-en un avec +.</p></section>');
}

/* ── RÉGLAGES ────────────────────────────────────────────────────────── */
function renderSettings(){
  let src='bgt4';try{if(!localStorage.getItem('bgt4')){if(localStorage.getItem('budgetV3'))src='budgetV3';else if(localStorage.getItem('budgetV2'))src='budgetV2';else src='nouveau';}}catch(e){}

/* ── Rendu global / navigation ───────────────────────────────────────── */
function render(){
  $('monthLabel').textContent=ML[month]+' '+year;
  renderDashboard();renderTransactions();renderStats();renderGoals();renderSettings();
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));
}
function switchPage(p){
  currentPage=p;
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  $('page-'+p).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
  try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){window.scrollTo(0,0);}
}

/* ── Feuille : transaction ───────────────────────────────────────────── */
function setType(type){$('editorSheet').dataset.type=type;document.querySelectorAll('#typeTabs button').forEach(b=>b.classList.toggle('active',b.dataset.type===type));$('editCat').closest('label').style.display=type==='income'?'none':'';syncRecur();}
function syncRecur(){
  let sel=$('editRecur');if(!sel)return;
  let v=sel.value;
  let nWrap=$('editRecurNWrap'),endWrap=$('editRecurEndWrap'),nLab=$('editRecurNLabel');
  if(nWrap)nWrap.style.display=(v==='everyN'||v==='installments')?'':'none';
  if(nLab)nLab.textContent=v==='installments'?'Nombre de paiements':'Intervalle (mois)';
  if(endWrap)endWrap.style.display=(v==='once')?'none':'';
}
function syncLifeCustom(){/* obsolète (remplacé par la récurrence) */}
function openSheet(type,idx){
  type=type||'expense';idx=(idx===0||idx)?String(idx):'';
  let arr=type==='income'?m().income:m().expenses;
  let r=idx!==''?arr[Number(idx)]:mkRow('',0,today(),'autres');
  $('editIndex').value=idx;setType(type);
  $('editName').value=r.name;$('editAmount').value=num(r.amount)||'';$('editDate').value=r.dueDate||today();
  $('editCat').innerHTML=Object.keys(cats).map(k=>'<option value="'+k+'"'+(r.cat===k?' selected':'')+'>'+cats[k]+'</option>').join('');
  $('editPaid').checked=!!r.paid||isAutoIncome(r);
  let tpl=r.templateId?findTpl(r.templateId):null;
  let recur=tpl?(num(tpl.installments)>0?'installments':(tpl.freq==='everyN'?'everyN':'monthly')):'once';
  if($('editRecur'))$('editRecur').value=recur;
  if($('editRecurN'))$('editRecurN').value=tpl?(recur==='installments'?tpl.installments:(recur==='everyN'?tpl.interval:'')):'';
  if($('editRecurEnd'))$('editRecurEnd').value=tpl?(tpl.endDate||''):'';
  if($('editScopeWrap'))$('editScopeWrap').style.display=(idx!==''&&tpl)?'':'none';
  if($('editScope'))$('editScope').value='one';
  syncRecur();
  $('btnDelete').style.display=idx===''?'none':'';
  $('sheetTitle').textContent=idx===''?'Ajouter une ligne':'Modifier la ligne';
  $('sheetBackdrop').classList.add('open');$('editorSheet').classList.add('open');
}
function closeSheet(){$('sheetBackdrop').classList.remove('open');$('editorSheet').classList.remove('open');$('goalSheet').classList.remove('open');}
function saveLine(){
  let type=$('editorSheet').dataset.type||'expense',idx=$('editIndex').value;
  let name=$('editName').value.trim();if(!name)return alert('Ajoute un libellé.');
  let amount=num($('editAmount').value);
  let cat=type==='income'?'autres':$('editCat').value;
  let dateVal=type==='income'?'':($('editDate').value||'');
  let paid=$('editPaid').checked;
  let recur=$('editRecur')?$('editRecur').value:'once';
  let recurN=Math.max(1,Math.round(num($('editRecurN').value)));
  let endDate=$('editRecurEnd')?$('editRecurEnd').value:'';
  let arr=type==='income'?m().income:m().expenses;
  let cur=idx!==''?arr[Number(idx)]:null;

  function applyFields(o){o.name=name;o.amount=amount;o.cat=cat;if(type!=='income')o.dueDate=dateVal;o.paid=paid;o.paidDate=paid?(o.paidDate||today()):'';if(type==='income')o.auto=isAutoIncome(o);}
  function buildTpl(t){
    t=t||{id:newId('tpl')};
    t.kind=type;t.name=name;t.amount=amount;t.cat=cat;
    t.freq=recur==='everyN'?'everyN':(recur==='once'?'once':'monthly');
    t.interval=recur==='everyN'?recurN:1;
    t.installments=recur==='installments'?recurN:0;
    let day=dateVal?(Number(dateVal.split('-')[2])||1):(t.dueDay||1);
    t.dueDay=day;
    if(!t.startDate)t.startDate=curKey()+'-'+p2(day);
    t.endDate=endDate||'';
    if(type==='income')t.auto=isAutoIncome({name:name});
    return t;
  }

  if(recur==='once'){
    if(cur){applyFields(cur);if(cur.templateId)delete cur.templateId;if(cur.recurring)delete cur.recurring;}
    else{let o=mkRow(name,amount,dateVal,cat);applyFields(o);o.createdPeriod=curKey();arr.push(o);}
  }else{
    let scope=(cur&&cur.templateId&&$('editScope'))?$('editScope').value:(cur?'one':'future');
    let tpl=cur&&cur.templateId?findTpl(cur.templateId):null;
    if(!tpl){tpl=buildTpl();app.recurringTemplates.push(tpl);}
    else if(scope!=='one'){buildTpl(tpl);}
    if(cur){applyFields(cur);cur.templateId=tpl.id;cur.recurring=true;}
    else{let o=opFromTpl(tpl,curKey());applyFields(o);o.templateId=tpl.id;arr.push(o);}
    if(scope==='future'||scope==='all'){
      Object.keys(app.monthlyData).forEach(k=>{
        if(k===curKey())return; if(scope==='future'&&k<curKey())return;
        let list=(type==='income')?app.monthlyData[k].income:app.monthlyData[k].expenses; if(!list)return;
        list.forEach(o=>{ if(o.templateId===tpl.id){o.name=name;o.amount=amount;o.cat=cat;if(type!=='income'){let day=Math.min(Math.max(1,tpl.dueDay),lastDay(k));o.dueDate=k+'-'+p2(day);}} });
      });
    }
  }
  save();render();closeSheet();
}
function delLine(){
  let type=$('editorSheet').dataset.type||'expense',idx=$('editIndex').value;
  if(idx==='')return;if(!confirm('Supprimer cette ligne ?'))return;
  if(type==='income')m().income.splice(Number(idx),1);else m().expenses.splice(Number(idx),1);
  save();render();closeSheet();
}

/* ── Feuille : objectif ──────────────────────────────────────────────── */
function openGoalSheet(i){
  let isNew=(i===''||i==null);let g=isNew?{n:'',e:'🎯',target:0,current:0}:goals[i];
  $('goalIndex').value=isNew?'':i;
  $('goalName').value=g.n;$('goalTarget').value=num(g.target)||'';$('goalCurrent').value=num(g.current)||'';
  $('goalEmoji').innerHTML=GOAL_EMOJIS.map(e=>'<option'+(g.e===e?' selected':'')+'>'+e+'</option>').join('');
  $('btnDeleteGoal').style.display=isNew?'none':'';
  $('goalSheetTitle').textContent=isNew?'Nouvel objectif':'Modifier l’objectif';
  $('sheetBackdrop').classList.add('open');$('goalSheet').classList.add('open');
}
function saveGoal(){
  let idx=$('goalIndex').value;let name=$('goalName').value.trim();if(!name)return alert('Ajoute un nom.');
  let g={n:name,e:$('goalEmoji').value,target:num($('goalTarget').value),current:num($('goalCurrent').value)};
  if(idx===''){g.id='g'+Date.now();goals.push(g);}else{g.id=goals[idx].id;goals[idx]=g;}
  saveGoals();render();closeSheet();
}
function delGoal(){let idx=$('goalIndex').value;if(idx==='')return;if(!confirm('Supprimer cet objectif ?'))return;goals.splice(Number(idx),1);saveGoals();render();closeSheet();}

/* ── Export / Import ─────────────────────────────────────────────────── */
function doExport(){$('jsonArea').value=JSON.stringify({meta:{app:'ORION v21',exported:new Date().toISOString()},app:app,goals:goals},null,2);}
function doImport(){
  let raw=$('jsonArea').value.trim();if(!raw)return alert('Colle d’abord un JSON.');
  let obj;try{obj=JSON.parse(raw);}catch(e){return alert('JSON invalide.');}
  if(!confirm('Remplacer les données actuelles par cet import ?'))return;
  try{
    let data=obj.app||obj;if(!data||(!data.months&&!data.years))return alert('Format non reconnu.');
    app=normalize(data);if(Array.isArray(obj.goals))goals=obj.goals.map(x=>({id:x.id||'g'+Math.random().toString(36).slice(2),n:x.n||'Objectif',e:x.e||'🎯',target:num(x.target),current:num(x.current)}));
    save();saveGoals();render();alert('Import réussi.');
  }catch(e){alert('Import impossible.');}
}

/* ── Événements ──────────────────────────────────────────────────────── */
document.addEventListener('click',e=>{
  let nav=e.target.closest('.bottom-nav button');if(nav)return switchPage(nav.dataset.page);
  let go=e.target.closest('[data-page-go]');if(go)return switchPage(go.dataset.pageGo);
  let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;renderTransactions();return;}
  let so=e.target.closest('[data-sort]');if(so){sortMode=(sortMode==='due')?'order':'due';renderTransactions();return;}
  let pn=e.target.closest('[data-period]');if(pn){navStep(pn.dataset.period==='next'?1:-1);return;}
  let tog=e.target.closest('[data-toggle]');if(tog){
    let arr=tog.dataset.toggle==='income'?m().income:m().expenses;let it=arr[Number(tog.dataset.index)];
    if(it&&!isAutoIncome(it)){it.paid=!it.paid;it.paidDate=it.paid?today():'';save();render();}
    else if(it&&isAutoIncome(it)){/* revenu automatique : non modifiable */}
    return;
  }
  let ed=e.target.closest('[data-edit]');if(ed)return openSheet(ed.dataset.edit,ed.dataset.index);
  let ge=e.target.closest('[data-goaledit]');if(ge)return openGoalSheet(Number(ge.dataset.goaledit));
  let seg=e.target.closest('#typeTabs button');if(seg)return setType(seg.dataset.type);
  switch(e.target.id){
    case 'addLine': case 'globalAdd': return openSheet('expense','');
    case 'addGoal': return openGoalSheet('');
    case 'btnCloseSheet': case 'btnCloseGoal': case 'sheetBackdrop': return closeSheet();
    case 'btnSaveLine': return saveLine();
    case 'btnDelete': return delLine();
    case 'btnSaveGoal': return saveGoal();
    case 'btnDeleteGoal': return delGoal();
    case 'btnRefresh': app=load();goals=loadGoals();render();return;
    case 'exportBtn': return doExport();
    case 'genRecurBtn': {let n=generateMissing(curKey());render();alert(n>0?(n+' opération(s) récurrente(s) ajoutée(s).'):'Ce mois contient déjà toutes les opérations récurrentes actives.');return;}
    case 'rollNextBtn': {let r=rollToNextMonth();render();alert(r.added>0?(r.added+' opération'+(r.added>1?'s ont':' a')+' été basculée'+(r.added>1?'s':'')+' vers '+ML[r.mo]+' '+r.y+'.'):('Aucune opération récurrente à basculer vers '+ML[r.mo]+' '+r.y+' (déjà à jour).'));return;}
    case 'importBtn': return doImport();
    case 'reloadBtn': if(confirm('Recharger les données depuis le stockage ?')){app=load();goals=loadGoals();render();} return;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='txSearch')renderTransactions();});
document.addEventListener('change',e=>{
  if(e.target.id==='monthPick'){goToPeriod(year,Number(e.target.value));}
  else if(e.target.id==='yearPick'){goToPeriod(Number(e.target.value),month);}
  else if(e.target.id==='editRecur'){syncRecur();}
});

/* ── Démarrage ───────────────────────────────────────────────────────── */
try{
  if(app._needBackup){ try{ let raw=localStorage.getItem('bgt4'); if(raw && !localStorage.getItem('orion_backup_preV3')) localStorage.setItem('orion_backup_preV3',raw); }catch(e){} delete app._needBackup; }
  ensurePeriod(year,month);
  if((app.recurringTemplates||[]).length===0){ seedTemplatesFromMonth(curKey()); app._migrated=true; }
  if(app._migrated){delete app._migrated;save();}
  render();
}
catch(err){
  if(window.console)console.error(err);
  document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;left:12px;right:12px;bottom:90px;background:#FFECEC;border:1px solid #FFB3B3;color:#B91C1C;padding:12px;border-radius:12px;z-index:999;font-size:12px">Erreur : '+esc(err&&err.message||err)+'</div>');
}
window.ORION={app,goals,totals,switchPage,render}; // debug/tests
try{window.ORION.dbg={ensureKey:ensureKey,readKey:readKey,generateMissing:generateMissing,seed:seedTemplatesFromMonth,goTo:goToPeriod,curKey:function(){return curKey();},tpls:function(){return app.recurringTemplates;},md:function(){return app.monthlyData;},tplOccurrence:tplOccurrence};}catch(e){}
})();

</script>

   Rôle :

whenReady(function(){
