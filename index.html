<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Budget Orion — application de gestion budgétaire claire, intelligente et locale.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f8fbf9">
<title>Budget Orion</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/orion-home.css">
<link rel="stylesheet" href="./css/orion-expenses.css">
<link rel="stylesheet" href="./css/orion-planning.css">
</head>
<body>
<div id="app" class="app">
  <header class="top">
    <div><h1 id="title">Budget Orion</h1><button id="periodBtn" class="period-pill">Août 2026⌄</button></div>
    <button class="bell" id="bellBtn">♢<span id="bellBadge" hidden></span></button>
  </header>
  <main id="view"></main>
  <nav class="nav" id="nav">
    <button data-page="home" class="active">⌂<small>Accueil</small></button>
    <button data-page="transactions">▤<small>Dépenses</small></button>
    <button data-page="planning">▣<small>Planif.</small></button>
    <button data-page="analysis">◔<small>Analyse</small></button>
    <button data-page="savings">♙<small>Épargne</small></button>
    <button data-page="plus">•••<small>Plus</small></button>
  </nav>
</div>
<div class="overlay" id="overlay"></div>
<section class="sheet" id="sheet">
  <div class="handle"></div>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" aria-label="Fermer">×</button></div>
  <div id="sheetBody"></div>
</section>
<script src="./js/brands.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
